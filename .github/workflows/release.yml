name: Publish tested 0.3.1 artifacts
on:
  push:
    branches: ['release/0.3.1']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 45727507570
          github-token: ${{ github.token }}
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.1
          name: Argument Mapper 0.3.1
          target_commitish: a4f39cd8003241274e3b0f5b0f15de8d1a572ff7
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
